<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TableFinder – Restaurant discovery prototype</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ===== TOP: brand, headline, search box + location ===== -->
    <header class="top">
      <div class="container">
        <p class="brand">TableFinder <span>prototype · powered by Algolia</span></p>
        <h1>Find a table you'll love</h1>
        <div class="search-row">
          <div id="searchbox"></div>
          <label class="location">
            <span>📍 Near</span>
            <select id="location-select">
              <option value="auto">My location</option>
              <option value="40.7128,-74.0060">New York</option>
              <option value="37.7749,-122.4194">San Francisco</option>
              <option value="29.7604,-95.3698">Houston</option>
              <option value="32.7157,-117.1611">San Diego</option>
              <option value="39.7392,-104.9903">Denver</option>
              <option value="36.1699,-115.1398">Las Vegas</option>
              <option value="21.3069,-157.8583">Honolulu</option>
            </select>
          </label>
        </div>
        <p id="location-status" class="location-status"></p>
      </div>
    </header>

    <!-- ===== DISCOVERY: cuisine carousel + filter bar (Deliveroo style) ===== -->
    <nav class="discover">
      <div class="container">
        <!-- Row 1: cuisine families as a scrollable carousel -->
        <div class="carousel">
          <button class="carousel__arrow carousel__arrow--left" aria-label="Scroll left">‹</button>
          <div id="cuisine-carousel" class="carousel__track"></div>
          <button class="carousel__arrow carousel__arrow--right" aria-label="Scroll right">›</button>
        </div>
        <div id="sub-cuisines" class="sub-cuisines"></div>

        <!-- Row 2: one line of filter pills (sort on the right) -->
        <div class="filterbar">
          <button class="pill" data-panel="panel-occasion">Occasion</button>
          <button class="pill" data-panel="panel-price">Price</button>
          <button class="pill" data-panel="panel-rating">Rating</button>
          <button class="pill" data-panel="panel-style">Dining style</button>
          <button class="pill" data-panel="panel-city">City</button>
          <select id="radius-select" class="pill pill--select" aria-label="Distance">
            <option value="1609">Within 1 mile</option>
            <option value="8047">Within 5 miles</option>
            <option value="48280" selected>Within 30 miles</option>
            <option value="all">Any distance</option>
          </select>
          <div id="sort-by" class="pill-sort"></div>
          <div id="clear-refinements"></div>
        </div>

        <!-- Drop-down panels: one opens under the bar when its pill is clicked -->
        <div class="panels">
          <div class="panel" id="panel-occasion"><div id="experiences"></div></div>
          <div class="panel" id="panel-price"><div id="price"></div></div>
          <div class="panel" id="panel-rating"><div id="rating"></div></div>
          <div class="panel" id="panel-style"><div id="dining-style"></div></div>
          <div class="panel" id="panel-city"><div id="city"></div></div>
        </div>
      </div>
    </nav>

    <!-- ===== RESULTS ===== -->
    <main class="container results">
      <!-- "Featured near you": top restaurants within 5 miles of the user -->
      <section id="featured-section" class="featured" hidden>
        <h2 id="featured-title">Featured near you</h2>
        <div id="featured" class="featured__track"></div>
      </section>

      <div id="stats"></div>
      <div id="current-refinements"></div>
      <div id="hits"></div>

      <!-- Shown only when nothing matches nearby: the closest matches further away -->
      <section id="closest-section" class="featured closest" hidden>
        <h2>Closest matches further away</h2>
        <div id="closest" class="featured__track"></div>
      </section>
    </main>

    <footer class="container footer">
      Prototype built for a demo · Search by Algolia · Food photos: Unsplash (illustrative, by cuisine)
    </footer>

    <!-- ===== LIBRARIES (loaded from a CDN, no installation needed) ===== -->
    <script src="https://cdn.jsdelivr.net/npm/algoliasearch@5.60.0/dist/lite/builds/browser.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4.120.0/dist/instantsearch.production.min.js"></script>
    <!-- ===== OUR CODE ===== -->
    <script src="app.js"></script>
  </body>
</html>
