<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TableFinder – Restaurant discovery prototype</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ===== TOP BAR: search box + location ===== -->
    <header class="hero">
      <div class="hero__inner">
        <p class="hero__brand">TableFinder <span>prototype · powered by Algolia</span></p>
        <h1>Find a table you'll love</h1>
        <div class="hero__search">
          <div id="searchbox"></div>
          <label class="location">
            <span>Near</span>
            <select id="location-select">
              <option value="auto">My location</option>
              <option value="40.7128,-74.0060">New York</option>
              <option value="37.7749,-122.4194">San Francisco</option>
              <option value="29.7604,-95.3698">Houston</option>
              <option value="32.7157,-117.1611">San Diego</option>
              <option value="39.7392,-104.9903">Denver</option>
              <option value="36.1699,-115.1398">Las Vegas</option>
              <option value="21.3069,-157.8583">Honolulu</option>
            </select>
          </label>
        </div>
        <p id="location-status" class="location-status"></p>
        <!-- "Explore by experience" chips: discovery for users with no restaurant in mind -->
        <div id="experiences" class="chips"></div>
      </div>
    </header>

    <!-- ===== MAIN AREA: filters on the left, results on the right ===== -->
    <main class="layout">
      <details class="filters" open>
        <summary>Filters</summary>
        <div id="clear-refinements"></div>
        <h3>Cuisine</h3>
        <div id="cuisine"></div>
        <h3>Price</h3>
        <div id="price"></div>
        <h3>Rating</h3>
        <div id="rating"></div>
        <h3>Dining style</h3>
        <div id="dining-style"></div>
        <h3>City</h3>
        <div id="city"></div>
      </details>

      <section class="results">
        <div class="results__bar">
          <div id="stats"></div>
          <div class="results__controls">
            <select id="radius-select" aria-label="Distance">
              <option value="all">Any distance</option>
              <option value="1609">Within 1 mile</option>
              <option value="8047">Within 5 miles</option>
              <option value="40234">Within 25 miles</option>
            </select>
            <div id="sort-by"></div>
          </div>
        </div>
        <div id="current-refinements"></div>
        <div id="hits"></div>
      </section>
    </main>

    <!-- ===== LIBRARIES (loaded from a CDN, no installation needed) ===== -->
    <script src="https://cdn.jsdelivr.net/npm/algoliasearch@5.60.0/dist/lite/builds/browser.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4.120.0/dist/instantsearch.production.min.js"></script>
    <!-- ===== OUR CODE ===== -->
    <script src="app.js"></script>
  </body>
</html>
